apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      containers:
        - name: juice-shop
          # Official, pre-built image — no Nix build here, we're consuming
          # someone else's maintained app, not authoring one.
          image: bkimminich/juice-shop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              # 512Mi OOMKilled Node under full-port nmap/gobuster scans —
              # this limit exists to be attacked, give it headroom.
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
