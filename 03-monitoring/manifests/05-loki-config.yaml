apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Retention even though storage is ephemeral — keeps Loki correct the day
    # someone adds a volume, instead of growing without bound in the writable
    # layer until then.
    limits_config:
      retention_period: 168h
    compactor:
      retention_enabled: true
      # Loki 3.x refuses to start with retention enabled unless this points
      # somewhere — filesystem maps to common.storage above.
      delete_request_store: filesystem
