apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      # k3s (containerd) writes container logs directly under
      # /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log — no symlink
      # chasing into a separate docker/containerd storage dir needed,
      # unlike Docker-based clusters.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # CRITICAL: without __path__, kubernetes_sd targets carry no file to
          # tail and promtail silently drops every one of them ("no path for
          # target") — Loki then receives nothing at all. The "/" separator
          # joins uid + container to match containerd's
          # /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log layout; the
          # default ";" separator would build unmatchable paths.
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
