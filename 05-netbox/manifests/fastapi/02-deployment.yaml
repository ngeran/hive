apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: netbox
spec:
  ports: [{ port: 80, targetPort: 8001 }]
  selector: { app: netbox }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  namespace: netbox
spec:
  replicas: 1
  selector: { matchLabels: { app: netbox } }
  template:
    metadata: { labels: { app: netbox } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: netbox
        image: localhost:5000/hive-netbox:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # THE CHEAT CODE: Mount writable volumes over the read-only paths
        - name: static-files
          mountPath: /app/netbox/static
        - name: media-files
          mountPath: /app/netbox/media
      volumes:
      - name: tmp
        emptyDir: {}
      - name: static-files
        emptyDir: {}
      - name: media-files
        emptyDir: {}
