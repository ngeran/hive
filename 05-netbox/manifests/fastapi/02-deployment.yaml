apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: netbox
spec:
  ports: [{ port: 80, targetPort: 8001 }]
  selector: { app: netbox }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  namespace: netbox
spec:
  replicas: 1
  selector: { matchLabels: { app: netbox } }
  template:
    metadata: { labels: { app: netbox } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # /static/ lives in an emptyDir (wiped on every pod start), so
      # collectstatic must run before gunicorn binds. The Nix image has no
      # fixed interpreter path, hence the store glob.
      # migrate must run before gunicorn — a fresh netbox-db (which is exactly
      # what a cluster rebuild leaves behind) has no tables, so every request
      # would 500 and createsuperuser would fail. Runs on every start;
      # Django's migrate is a no-op when current.
      initContainers:
      - name: migrate
        image: localhost:5000/hive-netbox:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            PY="$(ls -d /nix/store/*-netbox-env/bin/python | head -n1)"
            cd /app/netbox
            "$PY" manage.py migrate --noinput
      - name: collectstatic
        image: localhost:5000/hive-netbox:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            PY="$(ls -d /nix/store/*-netbox-env/bin/python | head -n1)"
            cd /app/netbox
            "$PY" manage.py collectstatic --noinput
        volumeMounts:
        - name: static-files
          mountPath: /app/netbox/static
      containers:
      - name: netbox
        image: localhost:5000/hive-netbox:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet: { path: /login/, port: 8001 }
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          # gunicorn --workers 3 ≈ 3 Django processes plus postgres/redis on
          # the same node — bounded so NetBox can't starve the fabric.
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { cpu: "1", memory: "1536Mi" }
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # THE CHEAT CODE: Mount writable volumes over the read-only paths
        - name: static-files
          mountPath: /app/netbox/static
        - name: media-files
          mountPath: /app/netbox/media
      volumes:
      - name: tmp
        emptyDir: {}
      - name: static-files
        emptyDir: {}
      - name: media-files
        emptyDir: {}
